            // 1. نتأكد إن قفل الاسترجاع مفتوح علشان يقدر يجمع الداتا من الشاشة
            window.isRestoringDraft = false; 
            
            // 2. نستدعي دالة الحفظ الذكية اللي بتلم الداتا وترفعها على السحابة (Firebase)
            window.saveWorkoutDraft();
            
            // 3. إظهار رسالة تأكيد تريح المستخدم وتأكد رفع الداتا
            showModal("تم الحفظ بنجاح ☁️✅", 
                `<div class='text-center p-4'>
                    <p class='font-bold text-slate-700 text-lg'>تم حفظ وتأمين قالب التمارين الخاص بك في السحابة!</p>
                    <p class='text-sm text-slate-500 mt-2 bg-emerald-50 p-2 rounded-lg border border-emerald-100'>يمكنك الآن تحديث الصفحة وأنت مطمئن، لن تفقد بيانات الجدول والصور.</p>
                </div>`, 
                [{text: "ممتاز", class: "bg-emerald-600 text-white"}]
            );
        };




// =====================================
        // المحرك الخارق للحفظ التلقائي واليدوي للأسطمبة (Auto-Save)
        // =====================================
        
        window.saveWorkoutDraft = function() {
            if(window.isRestoringDraft) return; // علشان ميحفظش داتا فاضية وقت التحميل
            const k = document.getElementById('log-member') ? document.getElementById('log-member').value : null;
            if(!k) return;
            
            let draft = {
                isWorkoutDay: document.getElementById('is-workout-day-toggle') ? document.getElementById('is-workout-day-toggle').checked : true,
                daysCount: document.getElementById('log-wo-days-count') ? document.getElementById('log-wo-days-count').value : 0,
                days: {}
            };

            const dayCards = document.querySelectorAll('[id^="wo-day-card-"]');
            dayCards.forEach(card => {
                const dIdx = card.id.replace('wo-day-card-', '');
                const toggleEl = document.getElementById(`wo-day-toggle-${dIdx}`);
                const isChecked = toggleEl ? toggleEl.checked : true;
                
                const exCountInput = document.getElementById(`wo-ex-count-${dIdx}`);
                const exCount = exCountInput ? exCountInput.value : 0;
                
                let exercises = [];
                const exRows = card.querySelectorAll('.wo-ex-row');
                exRows.forEach(row => {
                    const eIdx = row.getAttribute('data-ex');
                    const uniqueId = `${dIdx}_${eIdx}`;
                    exercises.push({
                        name: row.querySelector('.ex-name').value,
                        sets: row.querySelector('.ex-sets').value,
                        reps: row.querySelector('.ex-reps').value,
                        imgs: window.tempWorkoutImages[uniqueId] || [] 
                    });
                });

                draft.days[dIdx] = { isChecked, exCount, exercises };
            });

            if(!appState.workoutDrafts) appState.workoutDrafts = {};
            appState.workoutDrafts[k] = draft;
            saveState(); // الحفظ الفعلي في LocalStorage / Firebase
        };

        window.loadWorkoutDraft = function() {
            window.isRestoringDraft = true; // قفل الحفظ علشان منمسحش الأسطمبة وإحنا بنرسمها
            const k = document.getElementById('log-member') ? document.getElementById('log-member').value : null;
            
            if(!appState.workoutDrafts || !appState.workoutDrafts[k]) {
                window.isRestoringDraft = false;
                return;
            }
            
            const draft = appState.workoutDrafts[k];
            
            // 1. استرجاع هل يوجد تمرين اليوم (الزر الرئيسي)
            const mainToggle = document.getElementById('is-workout-day-toggle');
            if(mainToggle) {
                mainToggle.checked = draft.isWorkoutDay !== false;
                if(typeof window.toggleWorkoutSection === 'function') window.toggleWorkoutSection(mainToggle.checked);
            }

            // 2. استرجاع عدد أيام التمرين في الأسبوع
            const daysInput = document.getElementById('log-wo-days-count');
            if(daysInput && draft.daysCount) {
                daysInput.value = draft.daysCount;
                if(typeof window.buildWorkoutDaysUI === 'function') window.buildWorkoutDaysUI(draft.daysCount, true); 
                
                // 3. استرجاع تفاصيل كل يوم
                Object.keys(draft.days).forEach(dIdx => {
                    const dayData = draft.days[dIdx];
                    
                    const toggle = document.getElementById(`wo-day-toggle-${dIdx}`);
                    if(toggle) {
                        toggle.checked = dayData.isChecked;
                        if(typeof window.toggleSingleWorkoutDay === 'function') window.toggleSingleWorkoutDay(dIdx, dayData.isChecked);
                    }
                    
                    const exCountInput = document.getElementById(`wo-ex-count-${dIdx}`);
                    if(exCountInput && dayData.exCount > 0) {
                        exCountInput.value = dayData.exCount;
                        if(typeof window.buildExercisesUI === 'function') window.buildExercisesUI(dIdx, dayData.exCount, true);
                        
                        // 4. تعبئة البيانات
                        const card = document.getElementById(`wo-day-card-${dIdx}`);
                        if(card) {
                            const exRows = card.querySelectorAll('.wo-ex-row');
                            exRows.forEach((row, i) => {
                                if(dayData.exercises[i]) {
                                    row.querySelector('.ex-name').value = dayData.exercises[i].name || '';
                                    row.querySelector('.ex-sets').value = dayData.exercises[i].sets || '';
                                    row.querySelector('.ex-reps').value = dayData.exercises[i].reps || '';
                                    
                                    const eIdx = row.getAttribute('data-ex');
                                    const uniqueId = `${dIdx}_${eIdx}`;
                                    
                                    if(!window.tempWorkoutImages) window.tempWorkoutImages = {};
                                    window.tempWorkoutImages[uniqueId] = dayData.exercises[i].imgs || [];
                                    
                                    if(window.tempWorkoutImages[uniqueId].length > 0) {
                                        const preview = document.getElementById(`wo-preview-${uniqueId}`);
                                        if(preview) {
                                            preview.innerHTML = '';
                                            window.tempWorkoutImages[uniqueId].forEach(imgObj => {
                                                const thumbDiv = document.createElement('div');
                                                thumbDiv.className = "relative w-14 h-14 rounded-lg overflow-hidden border border-slate-300 shadow-sm animate-fade-in shrink-0 group";
                                                thumbDiv.id = `wo-thumb-${uniqueId}-${imgObj.id}`;
                                                thumbDiv.innerHTML = `
                                                    <img src="data:image/jpeg;base64,${imgObj.base64}" class="w-full h-full object-cover cursor-pointer hover:opacity-80 transition hover:scale-105" onclick="showModal('صورة التمرين', '<img src=\\'data:image/jpeg;base64,${imgObj.base64}\\' class=\\'w-full rounded-xl\\'>', [{text:'إغلاق',class:'bg-slate-200'}])">
                                                    <button onclick="window.removeWorkoutImage('${uniqueId}', ${imgObj.id}); window.saveWorkoutDraft();" class="absolute top-0 right-0 bg-red-500 text-white w-5 h-5 flex items-center justify-center rounded-bl-lg hover:bg-red-600 transition opacity-100 md:opacity-0 md:group-hover:opacity-100">
                                                        <i class="fas fa-times text-[10px]"></i>
                                                    </button>
                                                `;
                                                preview.appendChild(thumbDiv);
                                            });
                                        }
                                    }
                                }
                            });
                        }
                    }
                });
            }
            window.isRestoringDraft = false; // فتح القفل
        };

        // دالة الحفظ اليدوي للقالب (الزرار الأخضر اللي فوق)
        window.manualSaveDraftAlert = function() {
            const memberSelect = document.getElementById('log-member');
            if(!memberSelect || !memberSelect.value) {
                return alert("يرجى اختيار (تسجيل لـ) من الأعلى أولاً قبل حفظ القالب!");
            }

            window.isRestoringDraft = false; 
            window.saveWorkoutDraft();
            
            if(typeof showModal === 'function') {
                showModal("تم الحفظ بنجاح ☁️✅", 
                    `<div class='text-center p-4' dir="rtl">
                        <p class='font-bold text-slate-700 text-lg mb-2'>تم حفظ وتأمين قالب التمارين الخاص بك في السحابة!</p>
                        <p class='text-sm text-slate-500 bg-emerald-50 p-3 rounded-xl border border-emerald-200'>يمكنك الآن تحديث الصفحة وأنت مطمئن، لن تفقد بيانات الجدول والصور.</p>
                    </div>`, 
                    [{text: "ممتاز", class: "bg-emerald-600 text-white"}]
                );
            } else {
                alert("تم حفظ وتأمين القالب بنجاح!");
            }
        };



        window.onload = () => { initApp(); };
function runAutoResets() {
            const now = new Date();
            const todayStr = now.toLocaleDateString('ar-EG');
            
            // تحديد وقت بداية اليوم بناء على الإعدادات
            let [startHour, startMin] = (appState.settings.dayStartTime || '04:00').split(':');
            let dayStartObj = new Date(now);
            dayStartObj.setHours(parseInt(startHour), parseInt(startMin), 0, 0);

            // لو إحنا قبل وقت بداية اليوم (مثلا الساعة 2 الفجر وبداية اليوم 4)، نعتبر نفسنا في اليوم اللي قبله
            let effectiveDateStr = todayStr;
            if(now < dayStartObj) {
                let yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
                effectiveDateStr = yesterday.toLocaleDateString('ar-EG');
            }

            if(appState.lastAutoReset !== effectiveDateStr) {
                const members = ['husband', 'wife', 'aseel', 'aser'];
                const weekDaysEnAr = {'Saturday':'السبت', 'Sunday':'الأحد', 'Monday':'الإثنين', 'Tuesday':'الثلاثاء', 'Wednesday':'الأربعاء', 'Thursday':'الخميس', 'Friday':'الجمعة'};
                const currentDayNameAr = weekDaysEnAr[now.toLocaleDateString('en-US', {weekday:'long'})];
                const isNewWeek = (currentDayNameAr === appState.settings.weekStartDay);

                members.forEach(k => {
                    appState.schedules[k].forEach(sch => {
                        if(sch.recurrence === 'يومياً') sch.status = 'pending';
                        if(sch.recurrence === 'أسبوعياً' && isNewWeek) sch.status = 'pending';
                    });
                    appState.bedtimeRoutine[k].forEach(step => step.done = false);
                    appState.bedtimeRoutine[k].rewardedDate = ''; 
                });

                appState.lastAutoReset = effectiveDateStr;
                saveState();
            }
        }

    </script>
