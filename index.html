    <style>


/* 👔 تأثيرات الدولاب الذكي ثلاثي الأبعاد */
        .wardrobe-container {
            perspective: 1200px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border-radius: 1rem;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.5);
        }
        .hanger-item {
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            transform-origin: top center;
            z-index: 1;
            margin-left: -40px; /* تداخل الملابس */
        }
        .hanger-item:first-child { margin-left: 0; }
        
        /* حركة اليد بين الملابس */
        .hanger-item:hover {
            transform: rotateY(-20deg) translateX(-30px) scale(1.15);
            z-index: 10;
            margin-right: 40px;
            filter: drop-shadow(5px 15px 15px rgba(0,0,0,0.4));
        }
        
        /* حركة سحب القطعة من الدولاب */
        .pull-out-anim {
            animation: pullOut 0.8s forwards;
            pointer-events: none;
        }
        @keyframes pullOut {
            0% { transform: scale(1.15); opacity: 1; z-index: 50; }
            40% { transform: translateY(-30px) scale(1.3); z-index: 50; }
            100% { transform: translateY(-150px) scale(0.5); opacity: 0; }
        }



        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f9; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item.active { background-color: #e0f2fe; color: #0369a1; border-right: 4px solid #0369a1; font-weight: bold; }
        @media (max-width: 768px) { .nav-item.active { border-right: none; border-bottom: 4px solid #0369a1; } }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #14b8a6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #floating-ai { position: fixed; bottom: 80px; left: 20px; z-index: 90; }
        @media (min-width: 768px) { #floating-ai { bottom: 30px; left: 30px; } }
        #quran-player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; z-index: 100; transition: transform 0.3s ease; transform: translateY(100%); }

        @media (min-width: 768px) { #quran-player-bar { right: 16rem; } }
    </style>

// Core AI Logic - مطورة لتدعم أكثر من صورة معاً
        async function askAI(prompt, filesData = null, responseType = "text", loaderMsg = "جاري المعالجة...", mimeType = "image/jpeg") {
            const key = appState.apiKeys.gemini || "";
            if(!key) { alert("يرجى وضع مفتاح Gemini API في الإعدادات"); return null; }
            showLoading(loaderMsg);
            try {
                let parts = [{ text: prompt }];
                
                // دعم الصور المتعددة أو الصورة الواحدة أو الملفات
                if (filesData && Array.isArray(filesData)) {
                    filesData.forEach(file => {
                        parts.push({ inlineData: { mimeType: file.mimeType || "image/jpeg", data: file.data } });
                    });
                } else if (filesData) {
                    parts.push({ inlineData: { mimeType: mimeType, data: filesData } });
                }

                const payload = { contents: [{ parts: parts }], generationConfig: {} };
                if (responseType === "json") payload.generationConfig.responseMimeType = "application/json";

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`;
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                hideLoading();
                const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                return responseType === "json" ? JSON.parse(text.replace(/```json/g,'').replace(/```/g,'').trim()) : text;
            } catch (error) {
                hideLoading(); 
                alert("حدث خطأ في الاتصال بالذكاء الاصطناعي. تأكد من حجم الملفات أو الاتصال."); 
                console.error(error);
                return null;
            }
        }



        async function textToSpeech(text, voiceName = "Zephyr") {
            try {
                const key = appState.apiKeys.gemini;
                if(!key) return null;
                const payload = { contents: [{ parts: [{ text }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } }, model: "gemini-3.8-flash" };
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                const b64 = data?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                const mime = data?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.mimeType;
                if (b64 && mime) {
                    const sampleRate = parseInt(mime.match(/rate=(\d+)/)[1], 10) || 24000;
                    const pcmData = Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
                    const pcm16 = new Int16Array(pcmData);
                    const wavBuf = new ArrayBuffer(44 + pcm16.length * 2);
                    const view = new DataView(wavBuf);
                    const writeStr = (pos, str) => { for(let i=0; i<str.length; i++) view.setUint8(pos+i, str.charCodeAt(i)); };
                    writeStr(0, 'RIFF'); view.setUint32(4, 36 + pcm16.length * 2, true); writeStr(8, 'WAVE');
                    writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
                    writeStr(36, 'data'); view.setUint32(40, pcm16.length * 2, true);
                    for (let i = 0; i < pcm16.length; i++) view.setInt16(44 + i * 2, pcm16[i], true);
                    return URL.createObjectURL(new Blob([view], { type: 'audio/wav' }));
                }
            } catch (e) { return null; }
        }
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = () => resolve(r.result.split(',')[1]); r.onerror = e => reject(e);
            });
        }


// أداة ضغط الصور لتقليل المساحة بشكل كبير جداً
        function compressImageFile(file, maxWidth = 800, quality = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', quality).split(',')[1];
                        resolve(compressedBase64);
                    };
                };
                reader.onerror = error => reject(error);
            });
        }

        function startAiVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("متصفحك لا يدعم ميزة المايكروفون. يرجى استخدام Google Chrome.");
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG'; // اللهجة المصرية
            recognition.interimResults = false;

            const micBtn = document.getElementById('ai-mic-btn');
            
            recognition.onstart = function() {
                isRecording = true;
                micBtn.classList.replace('text-slate-400', 'text-red-500');
                micBtn.classList.add('animate-pulse');
                document.getElementById('ai-input').placeholder = "جاري الاستماع... تحدث الآن 🎤";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                const inputEl = document.getElementById('ai-input');
                // إضافة الكلام لمربع النص
                inputEl.value = (inputEl.value + " " + speechResult).trim();
            };

            recognition.onend = function() {
                isRecording = false;
                micBtn.classList.replace('text-red-500', 'text-slate-400');
                micBtn.classList.remove('animate-pulse');
                document.getElementById('ai-input').placeholder = "اسألني أي شيء...";
            };

            if(isRecording) recognition.stop(); else recognition.start();
        }

                filtered = filtered.filter(e => e.date === arDate || e.date.includes(dq.split('-')[2]));

// إضافة مصروف يدوي مع فحصه ذكياً لترحيله للمخزن
        window.addExp = async function(desc=null, amt=null) { 
            const d = desc || document.getElementById('exp-d').value.trim(); 
            const a = parseFloat(amt || document.getElementById('exp-a').value); 
            if(d && a) { 
                appState.budget.currentAvailable -= a; 
                appState.budget.expenses.unshift({id: generateId(), date: new Date().toLocaleDateString('ar-EG'), desc: d, amount: a}); 
                
                // فحص الذكاء الاصطناعي السريع
                const prompt = `هل "${d}" يعتبر صنف طعام أو بقالة أو منظفات يُخزن في المنزل؟
                أرجع JSON فقط: {"isItem": true/false, "name": "اسم الصنف الصافي بدون كلمات زائدة", "qty": 1, "unit": "وحدة/كيلو"}`;
                
                const aiCheck = await askAI(prompt, null, "json", "تسجيل المصروف وفحصه ذكياً...");
                
                if(aiCheck && aiCheck.isItem) {
                    let ex = appState.inventory.find(i => i.name.includes(aiCheck.name));
                    if(ex) { ex.qty += (aiCheck.qty || 1); }
                    else { appState.inventory.push({id: generateId(), name: aiCheck.name, qty: aiCheck.qty || 1, unit: aiCheck.unit || 'وحدة', purchaseDate: new Date().toISOString().split('T')[0], prodDate: '', expDate: '', alertBefore: 7}); }
                    alert(`✅ تم الخصم من الميزانية، وتمت إضافة "${aiCheck.name}" للمخزن تلقائياً!`);
                }
                saveState(); navigate('budget'); 
            } else {
                alert("الرجاء إدخال البيان والمبلغ.");
            }
        };

// دالة تفصيص الفواتير والسلع بالذكاء الاصطناعي (تدعم صور متعددة)
        window.processReceipt = async function(event) {
            const files = event.target.files; if(!files.length) return;
            
            let b64Array = [];
            showLoading("جاري ضغط الصور وتجهيزها...");
            for(let i=0; i<files.length; i++) {
                 b64Array.push({ mimeType: files[i].type, data: await compressImageFile(files[i], 1024, 0.7) });
            }

            const prompt = `أنت محاسب مالي مصري ذكي. أمامك صور قد تكون لفاتورة، لعدة فواتير، أو لسلع ومقاضي حقيقية.
            - إذا كانت الصور لفاتورة: استخرج كل السلع الموجودة بها، واكتب اسم كل سلعة، عددها (الكمية)، وسعرها الفردي، وتاريخ الشراء.
            - إذا كانت الصور لسلع حقيقية: تعرف على كل سلعة في الصور، حدد عددها، وقدر سعرها التقريبي العادل في السوق المصري حالياً.
            - حدد لكل سلعة هل هي من مستلزمات البيت/البقالة/الأكل لتضاف للمخزن (true) أم لا (false).
            أرجع الناتج كـ JSON فقط بهذا التنسيق حصراً:
            {
              "total": إجمالي_المبالغ_لجميع_الصور_كرقم,
              "date": "تاريخ_الشراء_YYYY-MM-DD",
              "items": [
                {"name": "اسم السلعة", "qty": الكمية_كرقم, "price": السعر_الإجمالي_لهذه_الكمية, "unit": "الوحدة", "isFood": true_or_false}
              ]
            }
            لا تضف أي نصوص خارج JSON.`;

            const res = await askAI(prompt, b64Array, "json", "الذكاء الاصطناعي يفحص الفواتير والسلع...");
            
            if(res && res.items && res.items.length > 0) {
                let htmlList = res.items.map(i => `
                    <div class="flex justify-between items-center bg-white p-2 border-b text-sm">
                        <span class="font-bold flex-1">${i.name} <span class="text-xs text-slate-500">(${i.qty} ${i.unit})</span></span>
                        <span class="text-red-600 font-bold">${i.price} ج</span>
                        ${i.isFood ? '<span class="text-xs bg-green-100 text-green-800 px-2 rounded ml-2">للمخزن 📦</span>' : ''}
                    </div>`).join('');
                
                showModal("مراجعة المشتريات المكتشفة 🛒", `
                    <div class="bg-slate-50 p-2 max-h-64 overflow-y-auto mb-4 border rounded-xl shadow-inner">${htmlList}</div>
                    <div class="flex justify-between items-center px-2">
                        <p class="font-bold text-lg text-slate-800">الإجمالي:</p>
                        <p class="font-bold text-2xl text-red-600">${res.total} ج.م</p>
                    </div>`, [
                    {text: "إلغاء", class: "bg-slate-200 text-slate-700"},
                    {text: "تأكيد وإضافة", class: "bg-teal-600 text-white", onClick: () => {
                        const recDate = res.date || new Date().toISOString().split('T')[0];
                        res.items.forEach(item => {
                            appState.budget.currentAvailable -= item.price;
                            appState.budget.expenses.unshift({id: generateId(), date: new Date().toLocaleDateString('ar-EG'), desc: item.name + ` (${item.qty} ${item.unit})`, amount: item.price});
                        });
                        let addedToInv = 0;
                        res.items.forEach(item => {
                            if(item.isFood) {
                                let ex = appState.inventory.find(inv => inv.name.includes(item.name));
                                if(ex) { ex.qty += (parseFloat(item.qty)||1); } 
                                else { appState.inventory.push({id: generateId(), name: item.name, qty: (parseFloat(item.qty)||1), unit: item.unit||'وحدة', purchaseDate: recDate, prodDate: '', expDate: '', alertBefore: 7}); }
                                addedToInv++;
                            }
                        });
                        saveState(); navigate('budget');
                        alert(`تم خصم المبالغ وإضافة المصروفات بدقة! \n📦 وتم ترحيل (${addedToInv}) صنف إلى المخزن تلقائياً.`);
                    }}
                ]);
            } else { alert("لم يتمكن الذكاء الاصطناعي من قراءة السلع، يرجى المحاولة بصورة أوضح."); }
            document.getElementById('receipt-upload').value = '';
        };



// --- نظام إرفاق الصور للمهام والأهداف والخطط ---
        let currentImageCallback = null;
        function triggerItemImageUpload(callback) {
            currentImageCallback = callback;
            let inp = document.getElementById('global-image-upload');
            if(!inp) {
                inp = document.createElement('input');
                inp.type = 'file';
                inp.accept = 'image/*';
                inp.id = 'global-image-upload';
                inp.style.display = 'none';
                document.body.appendChild(inp);
                inp.onchange = async (e) => {
                    const f = e.target.files[0];
                    if(!f) return;
                    showLoading("جاري ضغط وحفظ المرفق...");
                    try {
                        // ضغط الصورة لمقاس 600 بكسل علشان متسحبش مساحة السحابة
                        const b64 = await compressImageFile(f, 600, 0.6); 
                        if(currentImageCallback) currentImageCallback(b64);
                    } catch(err) {
                        alert("حدث خطأ أثناء رفع الصورة.");
                    }
                    hideLoading();
                    inp.value = ''; // تفريغ الخانة للمرة القادمة
                };
            }
            inp.click();
        }

        window.uploadItemImage = function(section, keyOrIndex, indexIfKey) {
            triggerItemImageUpload((b64) => {
                if(section === 'tasks' || section === 'requests' || section === 'goals' || section === 'schedules') {
                    const k = keyOrIndex;
                    const i = indexIfKey;
                    // دعم الداتا القديمة وتحويلها لتدعم الصور
                    if(typeof appState[section][k][i] === 'string') {
                        appState[section][k][i] = { text: appState[section][k][i], img: b64 };
                    } else {
                        appState[section][k][i].img = b64;
                    }
                } else if (section === 'plans') {
                    const i = keyOrIndex;
                    appState.futurePlans[i].img = b64;

// دالة الدمج الذكي للقوائم المشتركة
        window.mergeSharedList = function() {
            let mergedCount = 0;
            ['husband', 'wife'].forEach(k => {
                let i = appState.shoppingList[k].length;
                while(i--) {
                    let item = appState.shoppingList[k][i];
                    // البحث عن صنف مطابق في قائمة الزوج/الزوجة الآخر
                    let other = k === 'husband' ? 'wife' : 'husband';
                    let existsInOther = appState.shoppingList[other].findIndex(x => x.name.trim() === item.name.trim());
                    
                    if(existsInOther > -1) {
                        let otherItem = appState.shoppingList[other][existsInOther];
                        // نقله للمشتركة وجمعه
                        appState.shoppingList.shared.unshift({
                            id: generateId(), 
                            name: item.name, 
                            qty: item.qty + " + " + otherItem.qty, 
                            buy: false
                        });
                        // مسحه من القائمتين الفرديتين
                        appState.shoppingList[k].splice(i, 1);
                        appState.shoppingList[other].splice(existsInOther, 1);
                        mergedCount++;
                    }
                }
            });
            if(mergedCount > 0) {
                saveState(); navigate('shopping');
                alert(`✅ تم دمج الأصناف المتشابهة بنجاح ونقلها للقائمة المشتركة!`);
            } else {
                alert("لا توجد أصناف متشابهة بين قائمة الزوج والزوجة لدمجها.");
            }
        };

        window.addShopItem = function(k) {
            const n = document.getElementById(`sh-n-${k}`).value.trim();
            const q = document.getElementById(`sh-q-${k}`).value.trim() || '1';
            if (n) { appState.shoppingList[k].unshift({ id: generateId(), name: n, qty: q, buy: false }); saveState(); navigate('shopping'); }
        };
        
        window.delShopItem = function(k, i) { appState.shoppingList[k].splice(i, 1); saveState(); navigate('shopping'); };
        window.toggleShopBuy = function(k, i) { appState.shoppingList[k][i].buy = !appState.shoppingList[k][i].buy; saveState(); navigate('shopping'); };
        
        window.moveShopToBuy = function(k, i) {
            const item = appState.shoppingList[k].splice(i, 1)[0];
            item.buy = false; // نلغي التحديد لما ينزل العربة
            appState.shoppingList.toBuy.unshift(item);
            saveState(); navigate('shopping');
        };

        window.moveSelectedToBuy = function() {
            let moved = false;
            ['husband', 'wife', 'shared', 'ai', 'predicted'].forEach(k => {
                const checked = appState.shoppingList[k].filter(item => item.buy);
                const unchecked = appState.shoppingList[k].filter(item => !item.buy);
                if (checked.length > 0) {
                    checked.forEach(item => { item.buy = false; appState.shoppingList.toBuy.unshift(item); });
                    appState.shoppingList[k] = unchecked;
                    moved = true;
                }
            });
            if(moved) { saveState(); navigate('shopping'); } else { alert("لم يتم تحديد (✅) أي عناصر لنقلها!"); }
        };

            if (n) { appState.shoppingList.toBuy.unshift({ id: generateId(), name: n, qty: q, buy: false }); saveState(); navigate('shopping'); }

        window.checkoutToInventory = function() {
            const boughtItems = appState.shoppingList.toBuy.filter(item => item.buy);
            if (boughtItems.length === 0) return alert("قم بتحديد (✅) الأصناف التي تم شراؤها فعلياً من العربة أولاً لترحيلها!");

            const totalCost = prompt("أدخل إجمالي تكلفة هذه المشتريات لخصمها من الميزانية (اتركه فارغاً إذا لا تريد الخصم):");
            const cost = parseFloat(totalCost);
            
            if (!isNaN(cost) && cost > 0) {
                appState.budget.currentAvailable -= cost;
                appState.budget.expenses.unshift({ id: generateId(), date: new Date().toLocaleDateString('ar-EG'), desc: "مشتريات التسويقة الشاملة", amount: cost });
            }

            boughtItems.forEach(item => {
                // محاولة استخراج الرقم من نص الكمية (مثل "2 كيلو" -> 2)
                const numMatch = item.qty.match(/\\d+(\\.\\d+)?/);
                const qNum = numMatch ? parseFloat(numMatch[0]) : 1;
                const unitStr = item.qty.replace(/[0-9.]/g, '').trim() || 'وحدة';
                
                appState.inventory.unshift({ id: generateId(), name: item.name, qty: qNum, unit: unitStr, purchaseDate: new Date().toISOString().split('T')[0], prodDate: '', expDate: '', alertBefore: 7 });
            });

            // مسح المشتراة من العربة
            appState.shoppingList.toBuy = appState.shoppingList.toBuy.filter(item => !item.buy);
            saveState(); navigate('shopping');
            alert("✅ مبروك! تم تسجيل المصروفات وترحيل الأصناف إلى المخزن بنجاح.");
        };

            إليك خريطة نصية لهيكل المنزل (أماكن، وحدات، رفوف) ومحتوياتها الحالية، بالإضافة لـ ${b64Array.length} صور مرفقة تمثل شكل هذه الأماكن والرفوف.
            ادرس الخريطة والصور جيداً.
            المطلوب: بناء "قاعدة بيانات معرفية" (دليل قواعد منطقي) يربط بين نوعية الأشياء وأماكنها الصحيحة (مثلاً: البقوليات توضع في الرف الفلاني، المنظفات في المكان الفلاني).
            اكتب القواعد كنص واضح ومنظم لكي تستخدمه لاحقاً كمرجع لتوزيع الأغراض الجديدة.`;

            const res = await askAI(prompt, b64Array.length > 0 ? b64Array : null, "text", "جاري دراسة خريطة المنزل وصناعة سجل الذكاء (قد يستغرق وقتاً)...");
            if(res) {
                appState.aiHouseMemory = res;
                saveState(); navigate('housemap');
                alert("✅ تم تدريب الذكاء الاصطناعي بنجاح! 🧠 أصبح الآن يحفظ ترتيب بيتك وقواعده.");
            }
        };

        // 3. التوزيع التلقائي الذكي للأغراض الجديدة
        window.smartDistributeItems = async function(event) {
            const files = event.target.files; if(!files.length) return;
            if(!appState.aiHouseMemory) return alert("⚠️ يرجى تدريب الذكاء الاصطناعي أولاً باستخدام زر (استيعاب الخريطة) ليفهم منزلك!");

            let b64Array = [];
            showLoading("جاري فحص الأغراض المرفقة وتوزيعها...");
            for(let i=0; i<files.length; i++) { b64Array.push({ mimeType: files[i].type, data: await compressImageFile(files[i], 1024, 0.7) }); }

            const mapStructure = JSON.stringify(appState.houseMap.locations.map((loc, l) => ({
                locIdx: l, name: loc.name,
                units: (loc.storageUnits||[]).map((u, ui) => ({
                    unitIdx: ui, name: u.unitName,
                    shelves: (u.shelves||[]).map((s, si) => ({ shelfIdx: si, name: s.shelfName }))
                }))
            })));

            const prompt = `أنت روبوت ترتيب المنزل.
            سجلك المعرفي (قواعد الترتيب التي تعلمتها):
            ${appState.aiHouseMemory}

            وهذا هيكل المنزل الحالي وأكواد الأماكن:
            ${mapStructure}

            المطلوب: تعرف على جميع الأغراض الموجودة في الصور المرفقة، وبناءً على سجل فهمك للمنزل، حدد المكان الأنسب لكل غرض لتوزيعه.
            أرجع الناتج JSON حصراً بهذا التنسيق (بدون نصوص إضافية):
            {
              "items": [
                 {"name": "اسم الغرض", "qty": "الكمية", "locIdx": 0, "unitIdx": 0, "shelfIdx": 0}
              ]
            }`;

            const res = await askAI(prompt, b64Array, "json", "جاري توزيع الأغراض في أماكنها الصحيحة...");

            if(res && res.items) {
                let added = 0;
                res.items.forEach(item => {
                    try {
                        appState.houseMap.locations[item.locIdx].storageUnits[item.unitIdx].shelves[item.shelfIdx].items.push({name: item.name, qty: item.qty || '1', specificLocation: ''});
                        added++;
                    } catch(e) { console.log("خطأ مسار:", item); }
                });
                if(added > 0) {
                    saveState(); navigate('housemap');
                    alert(`🎉 تمت المهمة! قام الذكاء الاصطناعي بتوزيع ${added} غرض في أماكنهم الصحيحة بناءً على فهمه للمنزل.`);
                } else { alert("لم يتم التعرف على أغراض واضحة، حاول بصورة أوضح."); }
            } else { alert("حدث خطأ في التوزيع، راجع السجل وحاول مجدداً."); }
            
            document.getElementById('smart-distribute-cam').value = '';
        };

        // =====================================
        // دوال الخريطة اليدوية الأساسية

        window.searchHouseMap = function() {
            const query = document.getElementById('map-search-input').value.toLowerCase().trim();
            const resBox = document.getElementById('map-search-results');
            if(!query) { resBox.classList.add('hidden'); return; }

            let foundItems = [];
            appState.houseMap.locations.forEach(loc => {
                (loc.storageUnits || []).forEach(unit => {
                    unit.shelves.forEach(shelf => {
                        shelf.items.forEach(item => {
                            const specificLoc = item.specificLocation || '';
                            if(item.name.toLowerCase().includes(query) || specificLoc.toLowerCase().includes(query)) {
                                foundItems.push(`📍 <b>${item.name}</b> <span class="text-xs text-slate-500">(${item.qty})</span> <br> <span class="text-sm text-teal-700"><i class="fas fa-map-marker-alt"></i> في: ${loc.name} ⬅️ ${unit.unitName} ⬅️ ${shelf.shelfName} ${specificLoc ? `(${specificLoc})` : ''}</span>`);
                            }
                        });
                    });
                });
            });

            if(foundItems.length > 0) {
                resBox.classList.remove('hidden');
                resBox.innerHTML = `<h4 class="mb-3 border-b border-yellow-300 pb-2 text-lg">نتائج البحث:</h4><div class="space-y-4">` + foundItems.join('<div class="border-t border-yellow-200 pt-2"></div>') + `</div>`;
            } else {
                resBox.classList.remove('hidden');
                resBox.innerHTML = `لا يوجد صنف بهذا الاسم.`;
            }
        };

// دالة سحب كمية جزئية من المخزن (الاستهلاك)
        window.consumePartialItem = function(id) {
            const item = appState.inventory.find(x => x.id === id);
            if(!item) return;

            showModal(`سحب كمية من: ${item.name} 🛒`, 
                `<div class="space-y-4 text-right" dir="rtl">
                    <p class="text-slate-600 text-sm font-bold">المتاح حالياً: <span class="text-teal-600 bg-teal-50 px-2 rounded border border-teal-200">${item.qty} ${item.unit}</span></p>
                    <label class="block text-sm font-bold text-slate-700 mb-1">الكمية التي تم استهلاكها:</label>
                    <div class="flex gap-2">
                        <input type="number" id="consume-qty-input" max="${item.qty}" min="0.1" step="0.1" placeholder="مثال: 1" class="w-full border-2 p-3 rounded-xl bg-slate-50 outline-none focus:border-teal-400 font-bold text-lg text-center">
                        <span class="flex items-center justify-center bg-slate-100 px-4 rounded-xl border-2 font-bold text-slate-600 w-24">${item.unit}</span>
                    </div>
                </div>`, 
                [
                    {text: "إلغاء", class: "bg-slate-200 text-slate-800 font-bold"},
                    {text: "تسجيل الاستهلاك", class: "bg-teal-600 text-white font-bold", onClick: () => {
                        const consumed = parseFloat(document.getElementById('consume-qty-input').value);
                        if(isNaN(consumed) || consumed <= 0) return alert("يرجى إدخال كمية صحيحة!");
                        if(consumed > item.qty) return alert("الكمية المستهلكة أكبر من المتاح في المخزن!");
                        
                        // خصم الكمية من المخزن
                        item.qty -= consumed;
                        // لو في كسور كتير، نقربها لأقرب رقمين عشريين
                        item.qty = Math.round(item.qty * 100) / 100;
                        
                        // تسجيل الجزء المستهلك في الأرشيف
                        if(!appState.purchaseArchive) appState.purchaseArchive = [];
                        appState.purchaseArchive.push({
                            id: generateId(),
                            name: item.name,

        window.playTimerSound = function(audioCtx) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const playNote = (freq, startTime) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(1, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                osc.start(startTime);
                osc.stop(startTime + 0.5);
            };

        window.toggleSmartTimer = function(btn, minutes) {
            // لو الزرار لسه متضغطش قبل كده، بنأسسله الذاكرة الخاصة بيه
            if (!btn.timerObj) {
                btn.timerObj = {
                    total: minutes * 60,
                    left: minutes * 60,
                    state: 'stopped', 
                    interval: null,
                    originalHTML: btn.innerHTML,
                    originalClasses: btn.className
                };
            }

            const t = btn.timerObj;

            if (t.state === 'running') {
                // إيقاف مؤقت
                clearInterval(t.interval);
                t.state = 'paused';
                renderTimerBtn(btn);
            } else if (t.state === 'paused' || t.state === 'stopped') {
                // بدء أو استئناف
                t.state = 'running';
                if(!window.sharedAudioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    window.sharedAudioCtx = new AudioContext();
                }
                if(window.sharedAudioCtx.state === 'suspended') window.sharedAudioCtx.resume();

                t.interval = setInterval(() => {
                    t.left--;
                    if (t.left <= 0) {
                        // لما الوقت يخلص
                        clearInterval(t.interval);
                        t.state = 'done';
                        renderTimerBtn(btn);
                        playTimerSound(window.sharedAudioCtx);
                        showModal("انتهى المؤقت! ⏰", "<div class='text-center text-xl font-bold text-slate-700 py-4'>الخطوة دي خلصت، يلا بينا على اللي بعدها! 👨‍🍳</div>", [{text: "تمام", class: "bg-teal-600 text-white"}]);
                    } else {
                        renderTimerBtn(btn); // تحديث الثواني على الشاشة
                    }
                }, 1000);
                renderTimerBtn(btn);
            }
        };

        window.resetSmartTimer = function(event, btn) {
            event.stopPropagation(); // علشان ميشغلش الزرار الرئيسي وهو بيعمل إعادة
            const t = btn.timerObj;
            if(t) {
                clearInterval(t.interval);
                btn.className = t.originalClasses;
                btn.innerHTML = t.originalHTML;
                btn.timerObj = null; // فرمتة ذاكرة الزرار
            }
        };

        function renderTimerBtn(btn) {
            const t = btn.timerObj;
            let m = Math.floor(t.left / 60);
            let s = t.left % 60;
            let timeStr = `${m}:${s < 10 ? '0'+s : s}`;

            if (t.state === 'running') {
                btn.className = "timer-btn bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow flex items-center justify-between gap-3 w-fit transition-all duration-300";
                btn.innerHTML = `
                    <span class="animate-pulse flex items-center gap-2"><i class="fas fa-hourglass-half"></i> باقي ${timeStr}</span>
                    <div class="flex gap-3 border-r border-red-300 pr-3 ml-1">
                        <button onclick="event.stopPropagation(); toggleSmartTimer(this.closest('.timer-btn'))" title="إيقاف مؤقت" class="hover:text-red-200 transition scale-110"><i class="fas fa-pause"></i></button>
                        <button onclick="resetSmartTimer(event, this.closest('.timer-btn'))" title="إعادة من البداية" class="hover:text-red-200 transition scale-110"><i class="fas fa-redo"></i></button>
                    </div>
                `;
            } else if (t.state === 'paused') {
                btn.className = "timer-btn bg-yellow-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow flex items-center justify-between gap-3 w-fit transition-all duration-300";
                btn.innerHTML = `
                    <span class="flex items-center gap-2"><i class="fas fa-pause-circle"></i> متوقف (${timeStr})</span>
                    <div class="flex gap-3 border-r border-yellow-200 pr-3 ml-1">
                        <button onclick="event.stopPropagation(); toggleSmartTimer(this.closest('.timer-btn'))" title="استئناف" class="hover:text-yellow-100 transition scale-110"><i class="fas fa-play"></i></button>
                        <button onclick="resetSmartTimer(event, this.closest('.timer-btn'))" title="إعادة من البداية" class="hover:text-yellow-100 transition scale-110"><i class="fas fa-redo"></i></button>
                    </div>
                `;
            } else if (t.state === 'done') {
                btn.className = "timer-btn bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow flex items-center gap-2 w-fit transition-all duration-300";
                btn.innerHTML = `<i class="fas fa-check-circle text-lg"></i> انتهى الوقت!`;
                // يرجع لشكله الطبيعي بعد 4 ثواني من الرنة
                setTimeout(() => {
                    if(btn.timerObj && btn.timerObj.state === 'done') {
                        btn.className = t.originalClasses;
                        btn.innerHTML = t.originalHTML;
                        btn.timerObj = null;
                    }
                }, 4000);
            }
        }

        // =====================================

        window.toggleWorkoutSection = function(isWorkoutDay) {

            const dayInput = document.getElementById('log-wo-days-count');
            if(isWorkoutDay) {
                wrapper.classList.remove('hidden');
                wrapper.classList.add('opacity-100');
                dayInput.disabled = false;
            } else {
                wrapper.classList.add('hidden');
                wrapper.classList.remove('opacity-100');
                dayInput.disabled = true;
            }
        };

        // =====================================
        // دوال بناء الواجهة الديناميكية للتمارين
        // =====================================
        
// =====================================
        // دوال بناء وإخفاء التمارين (مع الاستخراج الذكي للصور)
        // =====================================
        
        window.buildWorkoutDaysUI = function(daysCount, isRestoring = false) {
            const container = document.getElementById('wo-days-container');
            if(!container) return;
            let count = parseInt(daysCount) || 0;
            
            if(count === 0) { 
                container.innerHTML = '<p class="text-xs text-slate-400 font-bold text-center bg-white py-6 rounded-xl border border-dashed border-slate-300">حدد عدد الأيام بالأعلى لفتح جداول التمارين.</p>'; 
                if(!isRestoring) window.saveWorkoutDraft(); 
                return; 
            }
            
            let html = '';
            for(let i=1; i<=count; i++) {
                html += `
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm transition-all duration-300" id="wo-day-card-${i}">
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 border-b pb-3 gap-3">
                            <div class="flex items-center gap-3">
                                <h5 class="font-bold text-slate-800 text-lg">اليوم الرياضي رقم (${i})</h5>
                                <label class="flex items-center cursor-pointer bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm hover:bg-slate-200 transition">
                                    <input type="checkbox" id="wo-day-toggle-${i}" checked onchange="window.toggleSingleWorkoutDay(${i}, this.checked)" class="w-4 h-4 accent-blue-600 cursor-pointer">
                                    <span class="ml-2 text-xs font-bold text-slate-700 select-none">هتمرن اليوم ده</span>
                                </label>

                                <!-- 🪄 زر الاستخراج بالذكاء الاصطناعي الجديد -->
                                <input type="file" id="ai-extract-wo-${i}" accept="image/*" multiple class="hidden" onchange="window.extractWorkoutFromImage(event, ${i})">
                                <button onclick="document.getElementById('ai-extract-wo-${i}').click()" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1">
                                    <i class="fas fa-magic"></i> قراءة من صورة
                                </button>

                                <label class="text-xs font-bold text-slate-600 mr-2">كم تمرين؟</label>
                                <input type="number" min="0" value="0" id="wo-ex-count-${i}" oninput="window.buildExercisesUI(${i}, this.value)" class="w-16 border border-slate-300 p-1.5 rounded text-center outline-none text-xs font-bold focus:border-blue-400 bg-white shadow-inner">
                            </div>
                        </div>
                        <div id="wo-ex-wrapper-${i}" class="transition-all duration-300 ease-in-out origin-top">
                            <div id="wo-ex-container-${i}" class="space-y-4">
                                <p class="text-xs text-slate-400 font-bold text-center py-4">حدد عدد التمارين أو ارفع صورة ليقوم الذكاء الاصطناعي بملئها.</p>
                            </div>
                        </div>
                    </div>
                `;
            }
            if(!isRestoring) {
                container.innerHTML = html;
                window.saveWorkoutDraft();
            } else {
                container.innerHTML = html;
            }
        };

        // =====================================
        // الدالة العبقرية لاستخراج التمارين من الصورة وتعبئتها أوتوماتيك
        // =====================================
        window.extractWorkoutFromImage = async function(event, dayIndex) {
            const files = event.target.files;
            if(!files || files.length === 0) return;

            showLoading("جاري تحليل الصور واستخراج التمارين بالذكاء الاصطناعي 🤖🏋️‍♂️...");
            
            try {
                let b64Array = [];
                for(let i=0; i<files.length; i++) {
                    b64Array.push({ mimeType: files[i].type, data: await compressImageFile(files[i], 1024, 0.7) });
                }

                const prompt = `أنت مدرب رياضي خبير. استخرج بيانات التمارين من الصور المرفقة (سواء كانت صورة لجدول، سكرين شوت من تطبيق، أو ورقة مكتوبة بخط اليد).
                المطلوب استخراج: اسم التمرين الدقيق، عدد المجاميع (Sets)، وعدد العدادات (Reps).
                إذا لم يكن عدد المجاميع واضحاً افترضه 3، وإذا لم تكن العدادات واضحة افترضها 12.
                
                أرجع الناتج بصيغة JSON فقط بهذا التنسيق حصراً بدون أي نصوص إضافية:
                {
                  "exercises": [
                    {"name": "اسم التمرين هنا", "sets": 3, "reps": 12}
                  ]
                }`;

                const res = await askAI(prompt, b64Array, "json", "أقوم بقراءة وكتابة التمارين...");

                if(res && res.exercises && res.exercises.length > 0) {
                    const exCount = res.exercises.length;
                    
                    // 1. تحديث عداد التمارين في الشاشة
                    const countInput = document.getElementById(`wo-ex-count-${dayIndex}`);
                    if(countInput) countInput.value = exCount;

                    // 2. بناء خانات فارغة على عدد التمارين المستخرجة (isRestoring = true عشان منسيفش قبل التعبئة)
                    window.buildExercisesUI(dayIndex, exCount, true);

                    // 3. تعبئة الخانات بالداتا اللي رجعت من الذكاء الاصطناعي
                    const card = document.getElementById(`wo-day-card-${dayIndex}`);
                    const exRows = card.querySelectorAll('.wo-ex-row');
                    
                    res.exercises.forEach((ex, idx) => {
                        if(exRows[idx]) {
                            exRows[idx].querySelector('.ex-name').value = ex.name || '';
                            exRows[idx].querySelector('.ex-sets').value = ex.sets || '';
                            exRows[idx].querySelector('.ex-reps').value = ex.reps || '';
                        }
                    });

                    // 4. الحفظ التلقائي لكل الداتا اللي اتكتبت دي في الأسطمبة!
                    window.saveWorkoutDraft();
                    
                    showModal("نجاح مبهر 🎉", `<div class='text-center p-4 font-bold text-slate-700 text-lg'>تم قراءة الصور بنجاح!<br>الذكاء الاصطناعي قام بإضافة <span class='text-brandOrange'>${exCount} تمارين</span> في الخانات أوتوماتيكياً.</div>`, [{text: "عاش 👏", class: "bg-emerald-600 text-white"}]);
                } else {
                    alert("لم أتمكن من العثور على تمارين واضحة في الصورة، حاول بصورة أوضح.");
                }
            } catch (err) {
                alert("حدث خطأ أثناء قراءة الصورة.");
            }
            
            hideLoading();
            event.target.value = ''; // تفريغ الخانة
        };



        window.buildExercisesUI = function(dayIndex, exCount) {
            const container = document.getElementById(`wo-ex-container-${dayIndex}`);
            if(!container) return;
            let count = parseInt(exCount) || 0;
            if(count === 0) { container.innerHTML = '<p class="text-xs text-slate-400 font-bold text-center py-4">حدد عدد التمارين لإضافة التفاصيل والصور.</p>'; return; }

            let html = '';
            for(let j=1; j<=count; j++) {
                const uniqueId = `${dayIndex}_${j}`;
                html += `
                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex flex-col gap-3 wo-ex-row shadow-sm" data-day="${dayIndex}" data-ex="${j}">
                        <div class="flex-1 w-full grid grid-cols-1 md:grid-cols-4 gap-3">
                            <input type="text" class="ex-name md:col-span-2 border border-slate-300 p-3 rounded-lg text-sm outline-none focus:border-brandOrange font-bold bg-white" placeholder="اسم التمرين (مثال: Bench Press)">
                            <input type="number" class="ex-sets md:col-span-1 border border-slate-300 p-3 rounded-lg text-sm outline-none text-center font-bold text-brandOrange bg-white" placeholder="المجاميع (3)">
                            <input type="number" class="ex-reps md:col-span-1 border border-slate-300 p-3 rounded-lg text-sm outline-none text-center font-bold text-brandOrange bg-white" placeholder="العدادات (12)">
                        </div>
                        <div class="flex flex-col lg:flex-row items-start lg:items-center gap-3 border-t border-slate-200 pt-3 w-full">

        // =====================================
        // رفع وحذف الصور المتعددة للتمارين
        // =====================================
        window.handleWorkoutImgUpload = async function(event, uniqueId) {
            const files = event.target.files;
            if(!files.length) return;
            
            const preview = document.getElementById(`wo-preview-${uniqueId}`);
            if(!window.tempWorkoutImages[uniqueId]) window.tempWorkoutImages[uniqueId] = [];
            
            if(window.tempWorkoutImages[uniqueId].length === 0) preview.innerHTML = ''; // مسح الرسالة الافتراضية

            const loaderId = `loader-${Date.now()}`;
            preview.insertAdjacentHTML('beforeend', `<div id="${loaderId}" class="w-12 h-12 flex items-center justify-center"><i class="fas fa-spinner fa-spin text-slate-400 text-lg"></i></div>`);

            for(let i=0; i<files.length; i++) {
                try {
                    const b64 = await compressImageFile(files[i], 800, 0.7); // ضغط الصورة 
                    const imgObj = { id: Date.now() + Math.random(), base64: b64 };
                    window.tempWorkoutImages[uniqueId].push(imgObj);
                    
                    const thumbDiv = document.createElement('div');
                    thumbDiv.className = "relative w-14 h-14 rounded-lg overflow-hidden border border-slate-300 shadow-sm animate-fade-in shrink-0 group";
                    thumbDiv.id = `wo-thumb-${uniqueId}-${imgObj.id}`;
                    thumbDiv.innerHTML = `
                        <img src="data:image/jpeg;base64,${b64}" class="w-full h-full object-cover cursor-pointer hover:opacity-80 transition hover:scale-105" onclick="showModal('صورة التمرين', '<img src=\\'data:image/jpeg;base64,${b64}\\' class=\\'w-full rounded-xl\\'>', [{text:'إغلاق',class:'bg-slate-200'}])">
                        <button onclick="window.removeWorkoutImage('${uniqueId}', ${imgObj.id})" class="absolute top-0 right-0 bg-red-500 text-white w-5 h-5 flex items-center justify-center rounded-bl-lg hover:bg-red-600 transition opacity-100 md:opacity-0 md:group-hover:opacity-100">
                            <i class="fas fa-times text-[10px]"></i>
                        </button>
                    `;
                    preview.appendChild(thumbDiv);
                } catch(e) {
                    alert("حدث خطأ أثناء معالجة إحدى صور التمرين.");
                }
            }
            
            const loader = document.getElementById(loaderId);
            if(loader) loader.remove();
            event.target.value = ''; 
        };

        window.removeWorkoutImage = function(uniqueId, imgId) {
            if(window.tempWorkoutImages[uniqueId]) {
                window.tempWorkoutImages[uniqueId] = window.tempWorkoutImages[uniqueId].filter(img => img.id !== imgId);
            }
            const thumb = document.getElementById(`wo-thumb-${uniqueId}-${imgId}`);
            if(thumb) thumb.remove();
            
            const preview = document.getElementById(`wo-preview-${uniqueId}`);
            if(window.tempWorkoutImages[uniqueId].length === 0) {
                preview.innerHTML = '<span class="text-[10px] text-slate-400 mx-auto font-bold">لم يتم إضافة صور (تظهر الثامبنايلز هنا)</span>';
            }
        };

        // =====================================
        // رفع وحذف صور الساعة
        // =====================================
        window.handleWatchImagesUpload = async function(event) {
            const files = event.target.files;
            if(!files.length) return;
            const container = document.getElementById('watch-thumbnails-container');
            if(window.tempWatchImages.length === 0) container.innerHTML = ''; 

            for(let i=0; i<files.length; i++) {
                try {
                    const b64 = await compressImageFile(files[i], 800, 0.7);
                    const imgObj = { id: Date.now() + Math.random(), base64: b64 };
                    window.tempWatchImages.push(imgObj);
                    
                    const thumbDiv = document.createElement('div');
                    thumbDiv.className = "relative w-20 h-20 rounded-xl overflow-hidden border border-blue-200 shadow-sm animate-fade-in group";
                    thumbDiv.id = `watch-thumb-${imgObj.id}`;
                    thumbDiv.innerHTML = `
                        <img src="data:image/jpeg;base64,${b64}" class="w-full h-full object-cover cursor-pointer hover:scale-105 transition" onclick="showModal('بيانات الساعة', '<img src=\\'data:image/jpeg;base64,${b64}\\' class=\\'w-full rounded-xl\\'>', [{text:'إغلاق',class:'bg-slate-200'}])">

        window.removeWatchImage = function(imgId) {

                document.getElementById('watch-thumbnails-container').innerHTML = '<span class="text-xs text-slate-400 my-auto mx-auto font-bold">الصور المرفوعة ستظهر هنا</span>';

        // ==========================================
        // حفظ اليومية واستعراضها (محدثة لدعم زرار الراحة)
        // ==========================================
        window.saveDailyFitnessLog = function() {
            const k = document.getElementById('log-member').value;
            
            // هل اليوم ده فيه تمرين ولا يوم راحة؟
            const isWorkoutDay = document.getElementById('is-workout-day-toggle').checked;

            // 1. تجميع بيانات الوجبات
            const mealsData = {
                day: document.getElementById('log-meal-day').value,
                bf: document.getElementById('log-m-bf').value.trim(),
                lu: document.getElementById('log-m-lu').value.trim(),
                sn: document.getElementById('log-m-sn').value.trim(),
                dn: document.getElementById('log-m-dn').value.trim()
            };

            // 2. تجميع بيانات التمارين مع الصور المتعددة (لو يوم تمرين)
            let workoutsData = [];
            if (isWorkoutDay) {
                const exRows = document.querySelectorAll('.wo-ex-row');
                exRows.forEach(row => {
                    const dIdx = row.getAttribute('data-day');
                    const eIdx = row.getAttribute('data-ex');
                    const uniqueId = `${dIdx}_${eIdx}`;
                    
                    const name = row.querySelector('.ex-name').value.trim();
                    const sets = row.querySelector('.ex-sets').value.trim();
                    const reps = row.querySelector('.ex-reps').value.trim();
                    // جلب كل الصور المرتبطة بالتمرين ده من الذاكرة
                    const imgArray = window.tempWorkoutImages[uniqueId] ? window.tempWorkoutImages[uniqueId].map(img => img.base64) : [];

                    if (name) { 
                        let dayObj = workoutsData.find(w => w.dayIndex == dIdx);
                        if (!dayObj) {
                            dayObj = { dayIndex: dIdx, exercises: [] };
                            workoutsData.push(dayObj);
                        }
                        dayObj.exercises.push({ name, sets: sets||0, reps: reps||0, imgs: imgArray, img: imgArray.length > 0 ? imgArray[0] : null });
                    }
                });
            }

            // 3. تجميع بيانات الساعة
            const watchStatsText = document.getElementById('log-watch-stats').value.trim();
            const watchImgsBase64 = window.tempWatchImages.map(img => img.base64);

            // التحقق
            const hasMeals = mealsData.bf || mealsData.lu || mealsData.sn || mealsData.dn;
            if(!hasMeals && workoutsData.length === 0 && !watchStatsText && watchImgsBase64.length === 0) {
                return alert("يرجى إدخال أي بيانات في (الوجبات، التمارين، أو الساعة) لحفظ اليومية!");
            }

            appState.dailyFitness[k].unshift({
                id: generateId(), 
                date: new Date().toLocaleDateString('ar-EG'),
                meals: mealsData,
                workouts: workoutsData, // لو مش يوم تمرين هتتحفظ فاضية (يوم راحة)
                watchStats: watchStatsText,
                watchImages: watchImgsBase64
            });

            // تنظيف الذاكرة للصور فقط (علشان نحافظ على القالب)
            window.tempWatchImages = [];
            window.tempWorkoutImages = {};
            saveState(); 
            navigate('diet'); 
            
            setTimeout(() => document.getElementById('daily-logs-section').scrollIntoView({behavior:'smooth'}), 300);
        };

            c = c.replace(/(قْ|طْ|بْ|جْ|دْ|قٌ|طٌ|بٌ|جٌ|دٌ|قٍ|طٍ|بٍ|جٍ|دٍ|قً|طً|بً|جً|دً)/g, '<span class="text-red-600 font-extrabold" title="قلقلة">$&</span>'); // أحمر للقلقلة
            c = c.replace(/(آ|ـٓ|ۤ|ۡ|ـٰ|ٓ)/g, '<span class="text-blue-600 font-extrabold" title="حكم مد">$&</span>'); // أزرق للمدود

function startQuranPlay(idx) { const sAyah = parseInt(document.getElementById('q-start-ayah').value) - 1; const eAyah = parseInt(document.getElementById('q-end-ayah').value) - 1; qTargetRepeat = parseInt(document.getElementById('q-repeat').value) || 1; qCurrentIdx = idx; if(idx < sAyah || idx > eAyah) { qEndIdx = qAyahs.length - 1; qTargetRepeat = 1; } else { qEndIdx = eAyah; } qRepeatCount = 0; playAyahIdx(); }

window.calcShoppingAI = async function() {
            // قراءة البيانات من الـ IDs الجديدة
            const duration = document.getElementById('unique-duration-input').value.trim();
            const requestedItems = document.getElementById('unique-items-input').value.trim();
            
            if(!duration) {
                return showModal("تنبيه 🔔", "<p class='text-center font-bold text-slate-700 py-4'>يرجى تحديد مدة التسويقة! (مثلاً: أسبوع، 10 أيام)</p>", [{text: "حسناً", class: "bg-teal-600 text-white"}]);
            }
            
            if(!appState.shoppingList.predicted) appState.shoppingList.predicted = [];

            // تجميع الداتا (الأسرة، الأرشيف، المخزن)
            const familyData = Object.values(appState.profiles).map(p => p.name).join('، ');
            
            const archiveData = appState.purchaseArchive && appState.purchaseArchive.length > 0 
                ? appState.purchaseArchive.map(i => `${i.name} (استُهلك منها: ${i.qty} ${i.unit})`).join(' | ') 
                : 'لا يوجد أرشيف استهلاك كافي بعد.';
                
            const invData = appState.inventory && appState.inventory.length > 0
                ? appState.inventory.map(i => `${i.name} (المتاح حالياً: ${i.qty} ${i.unit})`).join(' | ')
                : 'المخزن فارغ حالياً.';

            // الأمر الذكي (Prompt)
            let prompt = `أنت خبير اقتصاد منزلي ومخطط وجبات عبقري.
            - أفراد العائلة: ${familyData}.
            - المدة المطلوب تغطيتها بهذه التسويقة: ${duration}.`;
            
            if (requestedItems) {
                prompt += `\n- الأصناف التي يرغب المستخدم في شرائها: ${requestedItems}.`;
            } else {
                prompt += `\n- لم يحدد المستخدم أصناف معينة. المطلوب منك استنتاج النواقص الأساسية للبيت بناءً على ما هو موجود في المخزن وما تم استهلاكه في الأرشيف لتغطية احتياجات الأسرة لمدة (${duration}).`;
            }
            
            prompt += `\nبيانات هامة جداً للتحليل:
            1. أرشيف الاستهلاك السابق لمعرفة المعدل الطبيعي للأسرة: [${archiveData}]
            2. رصيد المخزن الحالي (يجب خصمه من الكمية المحسوبة حتى لا نشتري شيئاً متوفراً): [${invData}]

            المطلوب:
            احسب الكميات الدقيقة والواقعية جداً التي تكفي العائلة لمدة (${duration}) بناءً على طلباته (إن وجدت) والمتاح في المخزن ومعدل الاستهلاك.
            
            أرجع الناتج بصيغة JSON فقط بهذا التنسيق حصراً:
            {"items": [{"name": "اسم الصنف", "qty": "الكمية الدقيقة مع الوحدة (مثال: 2.5 كيلو)"}]}
            `;

            const res = await askAI(prompt, null, "json", `جاري التخطيط الذكي للتسويقة لمدة ${duration}...`);
            
            if(res && res.items) {
                appState.shoppingList.predicted = []; 
                
                res.items.forEach(item => {
                    appState.shoppingList.predicted.unshift({ id: generateId(), name: item.name, qty: item.qty, buy: false });
                });
                
                saveState();
                showModal("نجاح التخطيط 🎉", "<p class='text-center font-bold text-slate-700 py-4'>تم تخطيط التسويقة بنجاح! انتقل لقائمة (التسويقة الشاملة) لمراجعة الأصناف.</p>", [{text: "ممتاز", class: "bg-emerald-600 text-white"}]);
                navigate('shopping');
            }
        };

        window.togglePrayerStar = function(k, date, p, type, isChecked) {
            appState.prayersLog[date][k][p][type] = isChecked;
            if(isChecked) { appState.rewardsSys[k].stars += 1; } else { appState.rewardsSys[k].stars = Math.max(0, appState.rewardsSys[k].stars - 1); }
            saveState();
            document.getElementById(`stars-count-${k}`).innerText = appState.rewardsSys[k].stars + " ⭐";
        };

        window.savePrayerLogForMember = function(k, date) {
            let fardCount = 0; 
            let doneFard = [];
            let doneSunnah = [];
            
            Object.keys(appState.prayersLog[date][k]).forEach(p => { 
                const cleanName = p.split(' (')[0]; // يستخرج الاسم فقط مثل "الفجر" للأرشيف
                if(appState.prayersLog[date][k][p].fard) {
                    fardCount++;
                    doneFard.push(cleanName);
                }
                if(appState.prayersLog[date][k][p].sunnah) {
                    doneSunnah.push(cleanName);
                }
            });

            if(doneFard.length === 0 && doneSunnah.length === 0) {
                return alert("الرجاء تحديد صلاة واحدة على الأقل قبل الحفظ!");
            }

            // التأكد إذا كان اليوم مسجل مسبقاً لتحديثه
            const existingIndex = appState.prayerDailyLogs[k].findIndex(log => log.date === date);
            if(existingIndex > -1) {
                appState.prayerDailyLogs[k][existingIndex].fardList = doneFard;
                appState.prayerDailyLogs[k][existingIndex].sunnahList = doneSunnah;
            } else {
                appState.prayerDailyLogs[k].unshift({
                    id: generateId(),
                    date: date,
                    fardList: doneFard,
                    sunnahList: doneSunnah
                });
            }

            if(fardCount === 5 && !appState.prayersLog[date][k].rewarded5) { 
                appState.rewardsSys[k].stars += 5; 
                appState.prayersLog[date][k].rewarded5 = true; 
                alert(`ما شاء الله! أتممت الفروض الخمسة 🕋، مكافأة 5 نجوم إضافية ⭐ لـ ${appState.profiles[k].name}`); 
            } else { 
                alert("تم حفظ السجل بنجاح."); 
            }
            saveState(); navigate('prayer');
        };

        window.delPrayerDailyLog = function(k, logId) {
            if(confirm("هل أنت متأكد من حذف هذا السجل نهائياً؟")) {
                appState.prayerDailyLogs[k] = appState.prayerDailyLogs[k].filter(log => log.id !== logId);
                saveState();
                navigate('prayer');
            }

                            <button onclick="window.viewChatHistory('${type}')" class="bg-${color}-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-${color}-900 transition"><i class="fas fa-history"></i> السجل</button>

        window.appendSmartChatMsg = function(sender, text, color) {
            const box = document.getElementById('smart-chat-box'); if(!box) return;
            if(currentSmartSession.messages.length === 0 || currentSmartSession.messages[currentSmartSession.messages.length-1].text !== text) {
                currentSmartSession.messages.push({sender, text});
            }
            const isAI = sender === 'ai';
            box.innerHTML += `
                <div class="flex ${isAI ? 'justify-start' : 'justify-end'} fade-in">
                    <div class="max-w-[90%] p-4 rounded-2xl ${isAI ? `bg-white border border-${color}-200 shadow-md text-slate-800 rounded-tr-none` : `bg-${color}-100 text-${color}-900 shadow-sm rounded-tl-none border border-${color}-200`}">

                        <div class="prose max-w-none text-sm md:text-base leading-loose whitespace-pre-wrap">${text.replace(/\\n/g, '<br>')}</div>
                    </div>
                </div>

            box.scrollTop = box.scrollHeight;
        };

        window.sendSmartChatMsg = async function() {
            const inp = document.getElementById('smart-chat-input');
            const msg = inp.value.trim(); if(!msg) return;
            const colors = { quran: 'emerald', hadith: 'amber', shopping: 'orange', assistant: 'teal' };
            const color = colors[currentSmartSession.type];
            
            window.appendSmartChatMsg('user', msg, color); inp.value = '';
            
            let context = currentSmartSession.messages.map(m => (m.sender==='ai'?'المساعد: ':'المستخدم: ') + m.text).join('\\n');
            const res = await askAI(`بناء على هذا الحوار:\\n${context}\\n\\nأجب على استفسار المستخدم الأخير بدقة.`, null, "text", "جاري التفكير...");
            if(res) window.appendSmartChatMsg('ai', res, color);
        };

function logActivity(memberKey, activityDesc) {
            const today = new Date().toISOString().split('T')[0];
            if(!appState.activityLog[today]) appState.activityLog[today] = [];
            
            // إضافة النشاط لو مش موجود النهارده
            const exists = appState.activityLog[today].find(a => a.member === memberKey && a.desc === activityDesc);
            if(!exists) {
                appState.activityLog[today].push({ member: memberKey, desc: activityDesc, time: new Date().toLocaleTimeString('ar-EG') });
                // يمكن هنا إضافة نقاط للمكافآت تلقائياً (مثلاً 1 نجمة لكل نشاط ديني)
                appState.rewardsSys[memberKey].stars += 1; 
                saveState();
            }
        }

function showModal(t, c, b) { 
            document.getElementById('modal-title').querySelector('span').innerText=t;

            b.forEach(btn=>{ 
                const bb=document.createElement('button'); 
                bb.className=`px-5 py-2 rounded-lg font-bold flex items-center justify-center gap-2 ${btn.class}`; 
                bb.innerHTML=btn.text; 
                bb.onclick=()=>{if(btn.onClick)btn.onClick();document.getElementById('custom-modal').classList.add('hidden');}; 
                a.appendChild(bb);
            }); 
            document.getElementById('custom-modal').classList.remove('hidden'); 
        }

        // دالة مساعدة للنسخ الإجباري
        window.fallbackCopy = function(text, successAction) {
            try {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                let successful = document.execCommand('copy');
                textArea.remove();
                if(successful) { successAction(); } else { alert("عفواً، المتصفح يمنع النسخ التلقائي، جرب من متصفح جوجل كروم."); }
            } catch(e) {
                alert("خطأ في عملية النسخ الاحتياطية.");
            }
        };

// دالة الجرد الذكي (قراءة الفواتير وصور المنتجات)
        window.processInvBarcode = async function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            showLoading("جاري فحص الصور والجرد بالذكاء الاصطناعي 🤖📦...");

            try {
                const toBase64 = file => new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result.split(',')[1]); 
                    reader.onerror = error => reject(error);
                });

                let allNewItems = [];
                for (let i = 0; i < files.length; i++) {
                    const base64Img = await toBase64(files[i]);
                    const prompt = `أنت خبير جرد مستودعات. استخرج أسماء الأصناف من الصورة مع الكميات ووحدة القياس. أرجع JSON فقط: {"items": [{"name": "اسم", "qty": 1, "unit": "وحدة"}]}`;
                    const res = await askAI(prompt, base64Img, "json", `جاري استخراج الأصناف...`);
                    if (res && res.items) allNewItems = allNewItems.concat(res.items);
                }

                if (allNewItems.length > 0) {
                    allNewItems.forEach(item => {
                        appState.inventory.unshift({ id: generateId(), name: item.name, qty: parseFloat(item.qty) || 1, unit: item.unit || 'وحدة', purchaseDate: new Date().toLocaleDateString('en-CA'), prodDate: '', expDate: '', alertBefore: 7 });
                    });
                    saveState(); navigate('inventory');
                    
                    showModal("تم الجرد بنجاح ✅", 
                        `<div class='text-center p-4' dir="rtl"><p class='text-emerald-600 font-bold mb-3'>الذكاء الاصطناعي ضاف ${allNewItems.length} صنف للمخزن!</p></div>`, 
                        [{text: "ممتاز", class: "bg-emerald-600 text-white"}]
                    );
                } else {
                    alert("لم يتم العثور على أصناف واضحة.");
                }
            } catch (error) { alert("حدث خطأ أثناء معالجة الصور."); }
            
            hideLoading();
            event.target.value = '';
        };




// دالة الفلترة الذكية (محدثة لدعم الأيام الفردية وتصحيح التواريخ العربية)
        window.filterExpenses = function() {
            const tbody = document.getElementById('expenses-tbody');
            if(!tbody) return;

            const text = (document.getElementById('filter-text').value || '').toLowerCase();
            const dateFrom = document.getElementById('filter-date-from').value; 
            const dateTo = document.getElementById('filter-date-to').value; 

            let total = 0;
            let html = '';

            let dFrom = dateFrom ? new Date(dateFrom) : null;
            let dTo = dateTo ? new Date(dateTo) : null;

            // الذكاء الجديد: لو المستخدم اختار "من" بس وساب "إلى" فاضية، نعتبره عاوز اليوم ده بس!
            if (dFrom && !dTo) {
                dTo = new Date(dateFrom);
            }

            if (dFrom) dFrom.setHours(0,0,0,0);
            if (dTo) dTo.setHours(23,59,59,999);

            // دالة قوية جداً لفك شفرة التواريخ العربية وتنظيفها من الرموز المخفية
            const parseStoredDate = (dateStr) => {
                if(!dateStr) return new Date(0);
                // تنظيف النص من أي حروف أو رموز مخفية (السبب الرئيسي للمشكلة)
                let cleanStr = dateStr.replace(/[^\d٠-٩\/\-]/g, '');
                // تحويل الأرقام العربية لإنجليزية
                cleanStr = cleanStr.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
                cleanStr = cleanStr.replace(/-/g, '/'); // توحيد الفواصل
                
                const parts = cleanStr.split('/');
                if(parts.length === 3) {
                    if(parts[2].length === 4) return new Date(parts[2], parts[1] - 1, parts[0]); // صيغة يوم/شهر/سنة
                    if(parts[0].length === 4) return new Date(parts[0], parts[1] - 1, parts[2]); // صيغة سنة/شهر/يوم
                }
                return new Date(cleanStr); 
            };

            appState.budget.expenses.forEach((exp, i) => {
                const expDate = parseStoredDate(exp.date);
                let textMatch = (exp.desc || '').toLowerCase().includes(text);
                let dateMatch = true;

                // تطبيق الفلتر الزمني
                if (dFrom && expDate < dFrom) dateMatch = false;
                if (dTo && expDate > dTo) dateMatch = false;

                if (textMatch && dateMatch) {
                    total += parseFloat(exp.amount) || 0;
                    html += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                            <td class="p-3 text-sm">${exp.date}</td>
                            <td class="p-3 font-bold text-slate-700">${exp.desc}</td>
                            <td class="p-3 font-bold text-red-600 text-lg" dir="ltr">${exp.amount}</td>
                            <td class="p-3">

// ==========================================

            // تشغيل الفلتر تاني علشان يقرأ الجدول وهو فاضي من التحديد
            if(typeof window.filterExpenses === 'function') {
                window.filterExpenses();

        // 2. زر الحذف (مع استرداد الفلوس للميزانية تلقائياً)
        window.delExpense = function(index) {
            const exp = appState.budget.expenses[index];
            if(!exp) return;

            showModal("تأكيد الحذف واسترداد المبلغ 🔄", 
                `<p class='text-center font-bold text-lg text-slate-700 py-4' dir="rtl">
                    هل أنت متأكد من حذف مصروف (<span class="text-red-500">${exp.desc}</span>) <br> واسترداد مبلغه (<span class="text-green-600">${exp.amount} ج.م</span>) للميزانية المتاحة؟
                </p>`, 
                [
                {text: "إلغاء", class: "bg-slate-200 text-slate-800 font-bold"},
                {text: "نعم، احذف واسترد", class: "bg-red-600 text-white font-bold", onClick: () => {
                    // إرجاع المبلغ للميزانية المتاحة
                    appState.budget.currentAvailable += parseFloat(exp.amount);
                    // مسح المصروف من الأرشيف
                    appState.budget.expenses.splice(index, 1);
                    saveState(); 
                    navigate('budget');
                }}
            ]);
        };

        // 3. زر التعديل (تعديل الاسم، المبلغ، والتاريخ)
        window.editExpense = function(index) {
            const exp = appState.budget.expenses[index];
            if(!exp) return;

            // تظبيط التاريخ علشان يظهر صح في خانة النتيجة
            let formattedDate = "";
            try {
                let cleanStr = exp.date.replace(/[^\d٠-٩\/\-]/g, '').replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\//g, '-');
                let parts = cleanStr.split('-');
                if(parts.length === 3) {
                    if(parts[2].length === 4) formattedDate = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                    else if(parts[0].length === 4) formattedDate = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                }
            } catch(e) {}

            showModal("تعديل المصروف ✏️", `
                <div class="space-y-4 text-right" dir="rtl">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">البيان (اسم المصروف):</label>

                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">التاريخ:</label>
                        <input type="date" id="edit-exp-date-adv" value="${formattedDate}" class="w-full border-2 border-slate-200 p-3 rounded-xl outline-none bg-slate-50 focus:border-teal-500 font-bold text-slate-800">
                    </div>
                </div>
            `, [
                {text: "إلغاء", class: "bg-slate-200 text-slate-800 font-bold"},
                {text: "حفظ التعديل", class: "bg-teal-600 text-white font-bold", onClick: () => {
                    const newDesc = document.getElementById('edit-exp-desc-adv').value.trim();
                    const newAmt = parseFloat(document.getElementById('edit-exp-amt-adv').value);
                    const newDate = document.getElementById('edit-exp-date-adv').value;

                    if(newDesc && newAmt && !isNaN(newAmt) && newDate) {
                        // تعديل الميزانية المتاحة: نرجع المبلغ القديم ونخصم الجديد
                        appState.budget.currentAvailable = appState.budget.currentAvailable + parseFloat(exp.amount) - newAmt;
                        
                        // تحديث بيانات المصروف
                        appState.budget.expenses[index].desc = newDesc;
                        appState.budget.expenses[index].amount = newAmt;
                        appState.budget.expenses[index].date = new Date(newDate).toLocaleDateString('ar-EG');

                        saveState(); 
                        navigate('budget');
                    } else { 
                        alert("يرجى التأكد من إدخال البيان والمبلغ والتاريخ بشكل صحيح!");

                }}
            ]);
        };
